spring.application.name=Certus-Backend
# Load a local, Git-ignored .env file when present. System environment variables
# take precedence, which is what production hosting should use.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Asia/Kolkata}
server.port=${SERVER_PORT:8080}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
 
app.jwt.secret=${APP_JWT_SECRET}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.superadmin.email=${SUPER_ADMIN_EMAIL:${super_admin_email:}}

# Disable the database seeder by default to prevent erasing data
app.seeder.enabled=false
app.historyseeder.enabled=false
app.upload.directory=${REPORTS_UPLOAD_DIRECTORY:../uploads/reports}
app.package.directory=${PACKAGES_UPLOAD_DIRECTORY:../uploads/packages}
app.package-category.directory=${PACKAGE_CATEGORY_UPLOAD_DIRECTORY:../uploads/package-category}

# Allow large PDF report uploads (default is 1MB which is too small)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://certusdiagnostics.in,https://certusdiagnostics.in,http://admin.certusdiagnostics.in,https://admin.certusdiagnostics.in}

app.base-url=${APP_BASE_URL:https://certusdiagnostics.in}
app.client-url=${APP_CLIENT_URL:https://certusdiagnostics.in}

google.api.key=${GOOGLE_API_KEY}
google.api.place-id=${GOOGLE_PLACE_ID}
google.api.max-reviews=${MAX_REVIEWS:5}
app.timezone=${TIMEZONE:Asia/Kolkata}

# Google Reviews Fetching
google.api.fetching.enabled=false

# Generative AI
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GOOGLE_GEMINI_API_KEY:}
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.google.genai.chat.model=models/gemini-3.6-flash
spring.ai.google.genai.embedding.model=text-embedding-004

# PGvector Vector Store Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
